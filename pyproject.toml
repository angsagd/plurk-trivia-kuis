[project]
name = "plurk-trivia-kuis"
version = "0.1.0"
description = "Bot kuis trivia otomatis di Plurk beserta halaman admin web"
requires-python = ">=3.12,<3.13"
# Dependensi dikelola di requirements.txt dan requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs", "private"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DTZ"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# DTZ: datetime.now() tanpa zona waktu dilarang di mana pun kecuali di clock.py.
"tests/*" = ["DTZ001"]
"alembic/versions/*" = ["E501", "W291"]
