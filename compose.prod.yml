# Produksi di VPS, di belakang Traefik. Semua nilai spesifik server dibaca dari .env.
# Traefik di VPS memakai network_mode: host, sehingga menjangkau kontainer admin lewat IP-nya di network
# default proyek ini (tanpa network bersama). Bila Traefik berada di network Docker bersama, tambahkan
# -f compose.traefik-net.yml (lihat docs/deploy.md).
x-keras: &keras  # hardening: root filesystem read-only, tanpa capability Linux
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  admin:
    <<: *keras
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "*"   # hanya Traefik yang bisa menjangkau port 8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.plurk-trivia-kuis-admin.rule=Host(`${ADMIN_HOST:?isi ADMIN_HOST di .env}`)
      - traefik.http.routers.plurk-trivia-kuis-admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.plurk-trivia-kuis-admin.tls=true
      - traefik.http.routers.plurk-trivia-kuis-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:?isi TRAEFIK_CERTRESOLVER di .env}
      - traefik.http.services.plurk-trivia-kuis-admin.loadbalancer.server.port=8000
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    <<: *keras
    env_file: .env
    logging: *log
